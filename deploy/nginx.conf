# Reverse proxy + SPA fallback cho single-host self-host.
# TLS terminate ở nginx này (cert mount host `/etc/letsencrypt` read-only vào container).
# Backend upstream = 2 uvicorn container (ohana-ai / ohana-seller) qua docker network
# `ohana-net`.
#
# Route rule khớp thực tế 3-tier §3 DEPLOY.md:
#   /webhook/*                      → ohana-seller:8002  (Tầng 3 luồng B, Zalo webhook HTTPS bắt buộc)
#   /api/inbox|admin|mock/*         → ohana-seller:8002  (Tầng 3 seller UI + admin)
#   /api/assistant/*, /api/chat/*   → ohana-ai:8001      (Tầng 2 assistant + Tầng 3 chat luồng A)
#   /                               → SPA (React build)

upstream ohana_ai_upstream {
    # keepalive giữ connection giữa nginx và uvicorn — bớt TCP handshake mỗi request.
    server ohana-ai:8001 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream ohana_seller_upstream {
    server ohana-seller:8002 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# HTTP → HTTPS redirect (443 là entrypoint duy nhất cho public).
# ACME challenge (Let's Encrypt renew) đi qua HTTP dùng path riêng.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # Cert mount từ host `/etc/letsencrypt` vào container (read-only volume trong compose).
    # Renew certbot chạy trên HOST, không đóng gói vào compose.
    ssl_certificate     /etc/letsencrypt/live/api.ohana.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ohana.example/privkey.pem;

    # Modern TLS profile — Mozilla intermediate 2024. Zalo webhook client đủ mới cho cái này.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Client body — draft LLM trả lời ~4KB, ingest wiki ~500KB. 2MB đủ cho cả hai + margin.
    client_max_body_size 2m;

    # ── Healthcheck cho container healthcheck + external monitoring ──────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Webhook Zalo — luồng B, Tầng 3 ──────────────────────────────────────
    # Timeout dài để CTE §6.1 (webhook_seen + outbox trong 1 câu) xong trong 1 request.
    # Zalo timeout 30s ⇒ nginx read timeout đặt 30s khớp.
    location /webhook/ {
        proxy_pass http://ohana_seller_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Seller UI + admin + mock auth — luồng B ─────────────────────────────
    location ~ ^/api/(inbox|admin|mock)(/|$) {
        proxy_pass http://ohana_seller_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── SSE streaming — Tầng 2 assistant chat/stream (R1) ───────────────────
    # ĐẶT TRƯỚC location `/api/(assistant|chat)` chung — nginx match theo thứ tự khai
    # với regex, cần specific match ăn trước. `proxy_buffering off` để token frame push
    # thẳng client, không chờ buffer đầy. `proxy_cache off` cùng lý do.
    # `X-Accel-Buffering: no` đã set ở backend response header, đây là belt-and-braces.
    location = /api/assistant/chat/stream {
        proxy_pass http://ohana_ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Chunked transfer encoding cho SSE
        chunked_transfer_encoding on;
    }

    # ── Tầng 2 assistant + Tầng 3 chat luồng A ──────────────────────────────
    # LLM cold start ~25s (đo được, spec 07 §14). read_timeout đặt 60s cho margin.
    location ~ ^/api/(assistant|chat)(/|$) {
        proxy_pass http://ohana_ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # try_files → /index.html cho client-side routing của app.tsx (state machine
    # dùng state, không router URL, nhưng vẫn cần fallback nếu user F5 ở path lạ).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # Static asset cache dài (Vite hash vào filename)
        location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
