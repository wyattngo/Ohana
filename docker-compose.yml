# Hạ tầng LOCAL DEV. Không thay CI — CI vẫn `pip install -e ".[dev]"`,
# `alembic upgrade head`, `pytest`. App vẫn chạy trên host.
name: ohana-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ohana
      POSTGRES_PASSWORD: ${POSTGRES_PW}
      POSTGRES_DB: ohana
    ports: ["${OHANA_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohana -d ohana"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PW}
      POSTGRES_DB: langfuse
    volumes: [langfusedata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tầng 2 Phase 2.2 (D3, ADR §1) — Redis cho cost counter + rate-limit per-user.
  # KHÔNG persistent volume (D4 fail-open + kỷ luật MVP): counter per-day mất khi restart
  # là chấp nhận, cùng dáng với Redis chớp → fail-open. `--maxmemory-policy allkeys-lru`
  # bảo vệ memory nếu counter chưa expire kịp; `--save ""` tắt RDB (không cần disk I/O).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${OHANA_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # v2, KHÔNG v3 — v3 cần ClickHouse + Redis + MinIO.
  # Self-host là điều kiện để golden set C4 (PII thật) ở lại trong nước.
  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgres://postgres:${LANGFUSE_DB_PW}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  pgdata: {}
  langfusedata: {}