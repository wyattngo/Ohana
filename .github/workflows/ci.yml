name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ohana
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ohana
        options: >-
          --health-cmd "pg_isready -U ohana"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy api agent app auth bridge channels db parsing retrieval tools

      - name: Import structure check
        run: lint-imports

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://ohana:test@localhost:5432/ohana
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://ohana:test@localhost:5432/ohana
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: sk-ant-test
          TOGETHER_API_KEY: test-key
          LANGFUSE_PUBLIC_KEY: pk-lf-test
          LANGFUSE_SECRET_KEY: sk-lf-test
          LANGFUSE_HOST: http://localhost:3000
        run: pytest -v

      - name: Contract tests (isolation gates)
        env:
          DATABASE_URL: postgresql+psycopg://ohana:test@localhost:5432/ohana
        run: pytest tests/contract/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "image-tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "image-short=$(echo ${{ github.sha }} | head -c 7)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ohana-be:${{ steps.meta.outputs.image-short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ohana-be:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ohana-be:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ohana-be:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ohana-web:${{ steps.meta.outputs.image-short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ohana-web:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ohana-web:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ohana-web:buildcache,mode=max
